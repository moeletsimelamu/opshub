# Continuous integration: every push to main and every pull request is built and tested
# on a clean Linux machine, so "it works on my machine" is checked automatically.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allows a manual run from the Actions tab

# Least privilege: the jobs only need to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · build and test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # Install exactly the SDK version written in global.json. Asking for "the newest allowed"
      # instead made builds fail while Microsoft was part-way through publishing a release.
      - name: Read the SDK version from global.json
        id: sdk
        run: echo "version=$(jq -r .sdk.version global.json)" >> "$GITHUB_OUTPUT"

      - name: Install the .NET SDK pinned in global.json
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}

      - name: Restore NuGet packages
        run: dotnet restore

      # Warnings are errors (Directory.Build.props), so analyzer findings fail the build.
      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      # Unit tests (Domain) and integration tests (real API + in-memory SQLite).
      - name: Test
        run: dotnet test --configuration Release --no-build

  frontend:
    name: Frontend · test and build (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/OpsHub.Web

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/OpsHub.Web/package-lock.json

      # `npm ci` installs exactly what package-lock.json records, nothing newer.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npx ng test --watch=false

      # Production build, including the bundle-size budgets in angular.json.
      - name: Production build
        run: npx ng build

      # Fails on high or critical advisories in code shipped to browsers. Build-tool-only
      # advisories (devDependencies) are reported locally with `npm audit`.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  container:
    name: Container · build, run behind HTTPS, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]   # only package code that passed its tests

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build --tag opshub:ci .

      # Like a real first deployment: an empty /data volume, Production settings, HTTPS ended by
      # a reverse proxy (Caddy, with its own local certificate authority), and the first
      # administrator created from settings. The password is generated and never printed.
      - name: Start OpsHub behind an HTTPS reverse proxy
        run: |
          password="ci-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "SMOKE_PASSWORD=$password" >> "$GITHUB_ENV"
          docker network create --subnet 172.30.0.0/24 opshub-net
          docker run --detach --name opshub --network opshub-net --publish 8080:8080 \
            --env ReverseProxy__Enabled=true \
            --env ReverseProxy__KnownNetworks__0=172.30.0.0/24 \
            --env Bootstrap__AdminEmail=admin@ci.example \
            --env Bootstrap__AdminPassword="$password" \
            opshub:ci
          docker run --detach --name proxy --network opshub-net --publish 8443:8443 \
            caddy:2 caddy reverse-proxy --from https://localhost:8443 --to opshub:8080

      - name: Trust the proxy's certificate authority (TLS stays verified)
        run: |
          for attempt in $(seq 1 30); do
            docker exec proxy cat /data/caddy/pki/authorities/local/root.crt > "$RUNNER_TEMP/proxy-ca.crt" 2>/dev/null && break
            sleep 1
          done
          test -s "$RUNNER_TEMP/proxy-ca.crt"
          echo "SMOKE_CA_CERT=$RUNNER_TEMP/proxy-ca.crt" >> "$GITHUB_ENV"

      - name: Smoke test through the proxy
        run: bash scripts/smoke-test.sh https://localhost:8443 admin@ci.example

      # Straight to the container, bypassing the proxy: health probes work, the API refuses.
      - name: Plain HTTP reaches /health, but the API refuses it
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/me)" = 400

      # A restart must keep the database, the session keys and the administrator.
      - name: Restart the container and test again
        run: |
          docker restart opshub
          bash scripts/smoke-test.sh https://localhost:8443 admin@ci.example

      - name: Show the container logs
        if: always()
        run: |
          docker logs opshub || true
          docker logs proxy || true
